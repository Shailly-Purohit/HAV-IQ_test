  # ── Rollback: dev
  rollback_dev:
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'rollback/dev-')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @salesforce/cli
      - run: |
          HQ_FIFO=$(mktemp -u); mkfifo "$HQ_FIFO"; tee -a /tmp/haviq-step.log < "$HQ_FIFO" & HQ_TEE=$!; exec > "$HQ_FIFO" 2>&1; rm -f "$HQ_FIFO"; trap 'HQ_RC=$?; exec >&- 2>&-; wait $HQ_TEE; exit $HQ_RC' EXIT
          echo "${{ secrets.SF_JWT_KEY_DEV }}" > server.key
          sf org login jwt --client-id ${{ vars.SF_CLIENT_ID_DEV }} --jwt-key-file server.key --username ${{ vars.SF_USERNAME_DEV }} --instance-url ${{ vars.SF_ORG_URL_DEV }} --alias target
      - name: Resolve HAV-IQ manifest
        env:
          HAVIQ_VARS: ${{ toJSON(vars) }}
        run: |
          HQ_FIFO=$(mktemp -u); mkfifo "$HQ_FIFO"; tee -a /tmp/haviq-step.log < "$HQ_FIFO" & HQ_TEE=$!; exec > "$HQ_FIFO" 2>&1; rm -f "$HQ_FIFO"; trap 'HQ_RC=$?; exec >&- 2>&-; wait $HQ_TEE; exit $HQ_RC' EXIT
          TOK=$(git log -20 --pretty=%B | grep -oE "\[haviq-dep:[A-Za-z0-9]+\]" | head -1 | sed -E "s/.*:([A-Za-z0-9]+)\]/\1/")
          if [ -z "$TOK" ]; then
            if [ -s manifest/package.xml ]; then
              echo "No [haviq-dep:] token; falling back to the manifest on the branch."
              exit 0
            fi
            echo "ERROR: no manifest on the branch and no [haviq-dep:] token in the commit message"; exit 1
          fi
          echo "SF_DEPLOYMENT_ID=$TOK" >> "$GITHUB_ENV"
          # GitHub stores Actions variable names UPPERCASED, and deploy ids are
          # mixed case — look up the uppercased name or the lookup silently misses.
          TOK=$(echo "$TOK" | tr "[:lower:]" "[:upper:]")
          mkdir -p manifest
          echo "$HAVIQ_VARS" | jq -r --arg k "HAVIQ_PKG_$TOK" '.[$k] // empty' > manifest/package.xml
          if [ ! -s manifest/package.xml ]; then echo "ERROR: variable HAVIQ_PKG_$TOK not set"; exit 1; fi
          echo "$HAVIQ_VARS" | jq -r --arg k "HAVIQ_DESTRUCTIVE_$TOK" '.[$k] // empty' > manifest/destructiveChanges.xml
          echo "[OI-292] manifest (dep $TOK):"; cat manifest/package.xml
      - run: |
          HQ_FIFO=$(mktemp -u); mkfifo "$HQ_FIFO"; tee -a /tmp/haviq-step.log < "$HQ_FIFO" & HQ_TEE=$!; exec > "$HQ_FIFO" 2>&1; rm -f "$HQ_FIFO"; trap 'HQ_RC=$?; exec >&- 2>&-; wait $HQ_TEE; exit $HQ_RC' EXIT
          # OI-278 (v1.50): single sf project deploy start per rollback job
          HAS_DEL=$( [ -f manifest/destructiveChanges.xml ] && grep -q "<members>" manifest/destructiveChanges.xml && echo 1 || echo 0 )
          HAS_PKG=$( [ -f manifest/package.xml ] && grep -q "<members>" manifest/package.xml && echo 1 || echo 0 )
          if [ "$HAS_DEL" = "1" ]; then
            echo "Rollback: reverting (destructive + restore in one operation)..."
            set +e
            DOUT=$(sf project deploy start --manifest manifest/package.xml --pre-destructive-changes manifest/destructiveChanges.xml --target-org target --ignore-conflicts --test-level NoTestRun --wait 30 2>&1)
            DRC=$?
            set -e
            echo "$DOUT"
            if [ $DRC -ne 0 ]; then
              ABSENT=$(echo "$DOUT" | grep -oE "No [A-Za-z]+ named:? [^ ]+ found" | sort -u)
              OTHER=$(echo "$DOUT" | grep -iE "error|Problem" | grep -vcE "No [A-Za-z]+ named:? [^ ]+ found")
              if [ -n "$ABSENT" ] && [ "$OTHER" -eq 0 ]; then
                echo "[OI-317] Deletions skipped - already absent from the target org:"
                echo "$ABSENT"
                echo "[OI-317] The intended end state is already true. Continuing."
                echo "$ABSENT" > /tmp/haviq-already-absent.txt
              else
                echo "[OI-317] Destructive deploy failed beyond already-absent components."
                exit $DRC
              fi
            fi
          elif [ "$HAS_PKG" = "1" ]; then
            echo "Rollback: restoring components..."
            # RM-ROLLBACK-BY-TARGET-STATE: save what the target holds before this deploy changes it.
            if [ "${DCMD:-start}" = "start" ]; then (
              set +e
              HQ_DEP="${SF_DEPLOYMENT_ID:-$(git log -20 --pretty=%B | grep -oE "\[haviq-dep:[A-Za-z0-9]+\]" | head -1 | sed -E "s/.*:([A-Za-z0-9]+)\]/\1/")}"
              if [ -z "$HQ_DEP" ]; then echo "[haviq] pre-deploy versions not captured: no deployment id in the commit"; exit 0; fi
              if git ls-remote --tags origin "refs/tags/hq-pre-$HQ_DEP" 2>/dev/null | grep -q .; then echo "[haviq] pre-deploy versions captured: hq-pre-$HQ_DEP (by an earlier run)"; exit 0; fi
              HQ_PRE=$(mktemp -d); HQ_OUT="hq-pre-$HQ_DEP"; trap 'rm -rf "$HQ_OUT"' EXIT
              sf project retrieve start --manifest manifest/package.xml --target-org target --ignore-conflicts --output-dir "$HQ_OUT" --json > "$HQ_PRE/r.json" 2>/dev/null
              python3 -c "import json,sys,os; d=json.load(open(sys.argv[1])); r=d.get('result') or {}; sys.exit(1) if d.get('status',1)!=0 else None; out=os.path.realpath(sys.argv[4]); fs=[f for f in (r.get('files') or []) if f.get('state')!='Failed' and f.get('filePath')]; lm={(p.get('type'),p.get('fullName')):p.get('lastModifiedDate') for p in (r.get('fileProperties') or [])}; ks=list(dict.fromkeys([(f.get('type'),f.get('fullName')) for f in fs]+[k for k in lm if k[0]])); c=[{'type':t,'fullName':n,'lastModifiedDate':lm.get((t,n)),'files':sorted(os.path.relpath(os.path.realpath(f['filePath']),out) for f in fs if f.get('type')==t and f.get('fullName')==n)} for (t,n) in ks if t and t!='Package']; os.makedirs(os.path.dirname(sys.argv[2]),exist_ok=True); json.dump({'deployment':sys.argv[3],'components':c},open(sys.argv[2],'w'),indent=1)" "$HQ_PRE/r.json" "$HQ_OUT/manifest/haviq-pre-state.json" "$HQ_DEP" "$HQ_OUT" || { echo "[haviq] pre-deploy versions not captured: the retrieve from the target failed"; exit 0; }
              export GIT_INDEX_FILE="$HQ_PRE/idx" GIT_AUTHOR_NAME=HAV-IQ GIT_AUTHOR_EMAIL=noreply@haviq.io GIT_COMMITTER_NAME=HAV-IQ GIT_COMMITTER_EMAIL=noreply@haviq.io
              HQ_GIT=$(git rev-parse --absolute-git-dir)
              HQ_C=$(cd "$HQ_OUT" && git --git-dir="$HQ_GIT" --work-tree=. add -A . && HQ_TREE=$(git --git-dir="$HQ_GIT" write-tree) \
                && git --git-dir="$HQ_GIT" commit-tree "$HQ_TREE" -m "[skip ci] [haviq-pre:$HQ_DEP]")
              if [ -z "$HQ_C" ]; then echo "[haviq] pre-deploy versions not captured: could not build the capture commit"; exit 0; fi
              git push -q origin "$HQ_C:refs/tags/hq-pre-$HQ_DEP" 2>/dev/null \
                && echo "[haviq] pre-deploy versions captured: hq-pre-$HQ_DEP" || echo "[haviq] pre-deploy versions not captured: could not push tag hq-pre-$HQ_DEP"
            ) || true; fi
