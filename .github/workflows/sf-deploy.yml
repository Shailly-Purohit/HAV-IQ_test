name: SF Deploy

on:
  push:
    branches:
      - "promote/**"
      - "rollback/**"
      - "feature/*-to-*-resolve-*"
      - "production"
      - "qa"
      - "dev"
      - "dev1"
      - "feature/**-merge-**"
  pull_request:
    types: [opened, synchronize, reopened]
  repository_dispatch:
    types: [haviq-assemble, haviq-merge]

permissions:
  contents: write

jobs:

  # ── dev → qa
  validate_dev_to_qa:
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref_name, 'promote/dev-to-qa-')
      || startsWith(github.ref_name, 'feature/dev-to-qa-resolve-')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @salesforce/cli
      - run: |
          HQ_FIFO=$(mktemp -u); mkfifo "$HQ_FIFO"; tee -a /tmp/haviq-step.log < "$HQ_FIFO" & HQ_TEE=$!; exec > "$HQ_FIFO" 2>&1; rm -f "$HQ_FIFO"; trap 'HQ_RC=$?; exec >&- 2>&-; wait $HQ_TEE; exit $HQ_RC' EXIT
          echo "${{ secrets.SF_JWT_KEY_QA }}" > server.key
          sf org login jwt --client-id ${{ vars.SF_CLIENT_ID_QA }} --jwt-key-file server.key --username ${{ vars.SF_USERNAME_QA }} --instance-url ${{ vars.SF_ORG_URL_QA }} --alias target
      - name: Resolve HAV-IQ manifest
        env:
          HAVIQ_VARS: ${{ toJSON(vars) }}
        run: |
          HQ_FIFO=$(mktemp -u); mkfifo "$HQ_FIFO"; tee -a /tmp/haviq-step.log < "$HQ_FIFO" & HQ_TEE=$!; exec > "$HQ_FIFO" 2>&1; rm -f "$HQ_FIFO"; trap 'HQ_RC=$?; exec >&- 2>&-; wait $HQ_TEE; exit $HQ_RC' EXIT
          TOK=$(git log -20 --pretty=%B | grep -oE "\[haviq-dep:[A-Za-z0-9]+\]" | head -1 | sed -E "s/.*:([A-Za-z0-9]+)\]/\1/")
          if [ -z "$TOK" ]; then
            if [ -s manifest/package.xml ]; then
              echo "No [haviq-dep:] token; falling back to the manifest on the branch."
              exit 0
            fi
            echo "ERROR: no manifest on the branch and no [haviq-dep:] token in the commit message"; exit 1
          fi
          echo "SF_DEPLOYMENT_ID=$TOK" >> "$GITHUB_ENV"
          # GitHub stores Actions variable names UPPERCASED, and deploy ids are
          # mixed case — look up the uppercased name or the lookup silently misses.
          TOK=$(echo "$TOK" | tr "[:lower:]" "[:upper:]")
          mkdir -p manifest
          echo "$HAVIQ_VARS" | jq -r --arg k "HAVIQ_PKG_$TOK" '.[$k] // empty' > manifest/package.xml
          if [ ! -s manifest/package.xml ]; then echo "ERROR: variable HAVIQ_PKG_$TOK not set"; exit 1; fi
          echo "$HAVIQ_VARS" | jq -r --arg k "HAVIQ_DESTRUCTIVE_$TOK" '.[$k] // empty' > manifest/destructiveChanges.xml
          echo "[OI-292] manifest (dep $TOK):"; cat manifest/package.xml
      - run: |
          HQ_FIFO=$(mktemp -u); mkfifo "$HQ_FIFO"; tee -a /tmp/haviq-step.log < "$HQ_FIFO" & HQ_TEE=$!; exec > "$HQ_FIFO" 2>&1; rm -f "$HQ_FIFO"; trap 'HQ_RC=$?; exec >&- 2>&-; wait $HQ_TEE; exit $HQ_RC' EXIT
          # OI-472: "Validate" must validate, not deploy.
          git log -20 --pretty=%B | grep -m1 "\[haviq\]" | grep -q "\[validate-only\]" && DCMD="start --dry-run" || DCMD=start
          # RM-ROLLBACK-BY-TARGET-STATE: save what the target holds before this deploy changes it.
          if [ "${DCMD:-start}" = "start" ]; then (
            set +e
            HQ_DEP="${SF_DEPLOYMENT_ID:-$(git log -20 --pretty=%B | grep -oE "\[haviq-dep:[A-Za-z0-9]+\]" | head -1 | sed -E "s/.*:([A-Za-z0-9]+)\]/\1/")}"
            if [ -z "$HQ_DEP" ]; then echo "[haviq] pre-deploy versions not captured: no deployment id in the commit"; exit 0; fi
            if git ls-remote --tags origin "refs/tags/hq-pre-$HQ_DEP" 2>/dev/null | grep -q .; then echo "[haviq] pre-deploy versions captured: hq-pre-$HQ_DEP (by an earlier run)"; exit 0; fi
            HQ_PRE=$(mktemp -d); HQ_OUT="hq-pre-$HQ_DEP"; trap 'rm -rf "$HQ_OUT"' EXIT
            sf project retrieve start --manifest manifest/package.xml --target-org target --ignore-conflicts --output-dir "$HQ_OUT" --json > "$HQ_PRE/r.json" 2>/dev/null
            python3 -c "import json,sys,os; d=json.load(open(sys.argv[1])); r=d.get('result') or {}; sys.exit(1) if d.get('status',1)!=0 else None; out=os.path.realpath(sys.argv[4]); fs=[f for f in (r.get('files') or []) if f.get('state')!='Failed' and f.get('filePath')]; lm={(p.get('type'),p.get('fullName')):p.get('lastModifiedDate') for p in (r.get('fileProperties') or [])}; ks=list(dict.fromkeys([(f.get('type'),f.get('fullName')) for f in fs]+[k for k in lm if k[0]])); c=[{'type':t,'fullName':n,'lastModifiedDate':lm.get((t,n)),'files':sorted(os.path.relpath(os.path.realpath(f['filePath']),out) for f in fs if f.get('type')==t and f.get('fullName')==n)} for (t,n) in ks if t and t!='Package']; os.makedirs(os.path.dirname(sys.argv[2]),exist_ok=True); json.dump({'deployment':sys.argv[3],'components':c},open(sys.argv[2],'w'),indent=1)" "$HQ_PRE/r.json" "$HQ_OUT/manifest/haviq-pre-state.json" "$HQ_DEP" "$HQ_OUT" || { echo "[haviq] pre-deploy versions not captured: the retrieve from the target failed"; exit 0; }
            export GIT_INDEX_FILE="$HQ_PRE/idx" GIT_AUTHOR_NAME=HAV-IQ GIT_AUTHOR_EMAIL=noreply@haviq.io GIT_COMMITTER_NAME=HAV-IQ GIT_COMMITTER_EMAIL=noreply@haviq.io
            HQ_GIT=$(git rev-parse --absolute-git-dir)
            HQ_C=$(cd "$HQ_OUT" && git --git-dir="$HQ_GIT" --work-tree=. add -A . && HQ_TREE=$(git --git-dir="$HQ_GIT" write-tree) \
              && git --git-dir="$HQ_GIT" commit-tree "$HQ_TREE" -m "[skip ci] [haviq-pre:$HQ_DEP]")
            if [ -z "$HQ_C" ]; then echo "[haviq] pre-deploy versions not captured: could not build the capture commit"; exit 0; fi
            git push -q origin "$HQ_C:refs/tags/hq-pre-$HQ_DEP" 2>/dev/null \
              && echo "[haviq] pre-deploy versions captured: hq-pre-$HQ_DEP" || echo "[haviq] pre-deploy versions not captured: could not push tag hq-pre-$HQ_DEP"
          ) || true; fi
          sf project deploy $DCMD --manifest manifest/package.xml --target-org target --ignore-conflicts --test-level NoTestRun
      - name: Notify HAV-IQ
        if: failure()
        continue-on-error: true
        env:
          SF_JOB_STATUS: ${{ job.status }}
          SF_WEBHOOK_SECRET: ${{ secrets.SF_WEBHOOK_SECRET }}
          SF_BRANCH: ${{ github.head_ref || github.ref_name }}
          SF_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          STATUS=$([ "$SF_JOB_STATUS" = "success" ] && echo "passed" || echo "failed")
          ABSENT_JSON=""
          if [ -f /tmp/haviq-already-absent.txt ]; then
            ABSENT_JSON=$(python3 -c "import json;t=open('/tmp/haviq-already-absent.txt').read().strip();print(',\"alreadyAbsent\":'+json.dumps(t) if t else '')" 2>/dev/null || echo "")
          fi
          # OI-209: capture deploy failure reason from job log
          FAILURE_REASON_JSON=""
          if [ "$STATUS" = "failed" ]; then
            TRACE=$(cat /tmp/haviq-step.log 2>/dev/null || echo "")
            if [ -z "$TRACE" ]; then echo "[haviq] captured step log is empty; the failure reason will be blank."; fi
            MATCHED=$(echo "$TRACE" | grep -E "Problem|No such column|Variable does not exist|Component Failures|FAILED|✘" | head -40)
            # Fallback: a fixed keyword list always misses the next novel error — keep the trace tail so the reason is never blank.
            if [ -z "$MATCHED" ]; then MATCHED=$(echo "$TRACE" | grep -v "^[[:space:]]*$" | tail -40); fi
            FAILURE_REASON_JSON=$(echo "$MATCHED" | sed "s/\x1b\[[0-9;]*m//g" | head -c 30000 | python3 -c "import sys,json;t=sys.stdin.read().strip();print(json.dumps(t) if t else \"\")" 2>/dev/null || echo "")
          fi
          echo "${{ secrets.HAVIQ_PRIVATE_KEY }}" > /tmp/haviq.key
          if ! sf org login jwt --client-id "${{ vars.HAVIQ_CLIENT_ID }}" --jwt-key-file /tmp/haviq.key --username "${{ vars.HAVIQ_USERNAME }}" --instance-url "${{ vars.HAVIQ_URL }}" --alias haviq-hub > /tmp/haviq_login.out 2>&1; then
            echo "[haviq] Could not log in to HAV-IQ to report this result. The deploy result above is unaffected:"
            echo "[haviq] HAV-IQ reads it by polling instead, a few minutes later. To fix reporting, set the"
            echo "[haviq] pipeline's Self-Auth tab, click Regenerate CI YAML, and check the HAVIQ_PRIVATE_KEY secret."
            sed "s/^/[haviq]   /" /tmp/haviq_login.out | head -5
            rm -f /tmp/haviq.key
            exit 0
          fi
          SF_TOKEN=$(sf org auth show-access-token --target-org haviq-hub --json | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['result']['accessToken'])" 2>/dev/null || echo "")
          if [ -n "$SF_TOKEN" ]; then
            if [ -n "$FAILURE_REASON_JSON" ]; then
              BODY="{\"branch\":\"$SF_BRANCH\",\"commitSha\":\"$SF_COMMIT_SHA\",\"deploymentId\":\"$SF_DEPLOYMENT_ID\",\"status\":\"$STATUS\",\"failureReason\":$FAILURE_REASON_JSON,\"ciRunUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"$ABSENT_JSON}"
            else
              BODY="{\"branch\":\"$SF_BRANCH\",\"commitSha\":\"$SF_COMMIT_SHA\",\"deploymentId\":\"$SF_DEPLOYMENT_ID\",\"status\":\"$STATUS\",\"ciRunUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"$ABSENT_JSON}"
            fi
            HAVIQ_HTTP=$(curl -s -o /tmp/haviq_cb.out -w "%{http_code}" -X POST "${{ vars.HAVIQ_URL }}/services/apexrest/haviq/pipeline/webhook" -H "Authorization: Bearer $SF_TOKEN" -H "Content-Type: application/json" -H "x-sf-devops-secret: $SF_WEBHOOK_SECRET" -d "$BODY" || echo "000")
            echo "HAV-IQ callback HTTP $HAVIQ_HTTP"; cat /tmp/haviq_cb.out 2>/dev/null || true
            if [ "$HAVIQ_HTTP" = "401" ]; then echo "Callback rejected: check the SF_WEBHOOK_SECRET repository secret matches the pipeline webhook secret."; fi
          fi
          rm -f /tmp/haviq.key
  deploy_dev_to_qa:
    needs: validate_dev_to_qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @salesforce/cli
      - run: |
          HQ_FIFO=$(mktemp -u); mkfifo "$HQ_FIFO"; tee -a /tmp/haviq-step.log < "$HQ_FIFO" & HQ_TEE=$!; exec > "$HQ_FIFO" 2>&1; rm -f "$HQ_FIFO"; trap 'HQ_RC=$?; exec >&- 2>&-; wait $HQ_TEE; exit $HQ_RC' EXIT
          echo "${{ secrets.SF_JWT_KEY_QA }}" > server.key
          sf org login jwt --client-id ${{ vars.SF_CLIENT_ID_QA }} --jwt-key-file server.key --username ${{ vars.SF_USERNAME_QA }} --instance-url ${{ vars.SF_ORG_URL_QA }} --alias target
          if git log -1 --pretty=%B | grep -q "\[run-tests\]"; then
            for i in 1 2 3; do sf apex run test --target-org target --test-level RunLocalTests --wait 10 && break; [ $i -lt 3 ] && echo "Test run busy, retrying in 60s..." && sleep 60 || exit 1; done
          fi
      - name: Resolve HAV-IQ manifest
        env:
          HAVIQ_VARS: ${{ toJSON(vars) }}
        run: |
          HQ_FIFO=$(mktemp -u); mkfifo "$HQ_FIFO"; tee -a /tmp/haviq-step.log < "$HQ_FIFO" & HQ_TEE=$!; exec > "$HQ_FIFO" 2>&1; rm -f "$HQ_FIFO"; trap 'HQ_RC=$?; exec >&- 2>&-; wait $HQ_TEE; exit $HQ_RC' EXIT
          TOK=$(git log -20 --pretty=%B | grep -oE "\[haviq-dep:[A-Za-z0-9]+\]" | head -1 | sed -E "s/.*:([A-Za-z0-9]+)\]/\1/")
          if [ -z "$TOK" ]; then
            if [ -s manifest/package.xml ]; then
              echo "No [haviq-dep:] token; falling back to the manifest on the branch."
              exit 0
            fi
            echo "ERROR: no manifest on the branch and no [haviq-dep:] token in the commit message"; exit 1
          fi
          echo "SF_DEPLOYMENT_ID=$TOK" >> "$GITHUB_ENV"
          # GitHub stores Actions variable names UPPERCASED, and deploy ids are
          # mixed case — look up the uppercased name or the lookup silently misses.
          TOK=$(echo "$TOK" | tr "[:lower:]" "[:upper:]")
          mkdir -p manifest
          echo "$HAVIQ_VARS" | jq -r --arg k "HAVIQ_PKG_$TOK" '.[$k] // empty' > manifest/package.xml
          if [ ! -s manifest/package.xml ]; then echo "ERROR: variable HAVIQ_PKG_$TOK not set"; exit 1; fi
          echo "$HAVIQ_VARS" | jq -r --arg k "HAVIQ_DESTRUCTIVE_$TOK" '.[$k] // empty' > manifest/destructiveChanges.xml
          echo "[OI-292] manifest (dep $TOK):"; cat manifest/package.xml
      - run: |
          HQ_FIFO=$(mktemp -u); mkfifo "$HQ_FIFO"; tee -a /tmp/haviq-step.log < "$HQ_FIFO" & HQ_TEE=$!; exec > "$HQ_FIFO" 2>&1; rm -f "$HQ_FIFO"; trap 'HQ_RC=$?; exec >&- 2>&-; wait $HQ_TEE; exit $HQ_RC' EXIT
          # OI-472: "Validate" must validate, not deploy.
          git log -20 --pretty=%B | grep -m1 "\[haviq\]" | grep -q "\[validate-only\]" && DCMD="start --dry-run" || DCMD=start
          # RM-ROLLBACK-BY-TARGET-STATE: save what the target holds before this deploy changes it.
          if [ "${DCMD:-start}" = "start" ]; then (
            set +e
            HQ_DEP="${SF_DEPLOYMENT_ID:-$(git log -20 --pretty=%B | grep -oE "\[haviq-dep:[A-Za-z0-9]+\]" | head -1 | sed -E "s/.*:([A-Za-z0-9]+)\]/\1/")}"
            if [ -z "$HQ_DEP" ]; then echo "[haviq] pre-deploy versions not captured: no deployment id in the commit"; exit 0; fi
            if git ls-remote --tags origin "refs/tags/hq-pre-$HQ_DEP" 2>/dev/null | grep -q .; then echo "[haviq] pre-deploy versions captured: hq-pre-$HQ_DEP (by an earlier run)"; exit 0; fi
            HQ_PRE=$(mktemp -d); HQ_OUT="hq-pre-$HQ_DEP"; trap 'rm -rf "$HQ_OUT"' EXIT
            sf project retrieve start --manifest manifest/package.xml --target-org target --ignore-conflicts --output-dir "$HQ_OUT" --json > "$HQ_PRE/r.json" 2>/dev/null
            python3 -c "import json,sys,os; d=json.load(open(sys.argv[1])); r=d.get('result') or {}; sys.exit(1) if d.get('status',1)!=0 else None; out=os.path.realpath(sys.argv[4]); fs=[f for f in (r.get('files') or []) if f.get('state')!='Failed' and f.get('filePath')]; lm={(p.get('type'),p.get('fullName')):p.get('lastModifiedDate') for p in (r.get('fileProperties') or [])}; ks=list(dict.fromkeys([(f.get('type'),f.get('fullName')) for f in fs]+[k for k in lm if k[0]])); c=[{'type':t,'fullName':n,'lastModifiedDate':lm.get((t,n)),'files':sorted(os.path.relpath(os.path.realpath(f['filePath']),out) for f in fs if f.get('type')==t and f.get('fullName')==n)} for (t,n) in ks if t and t!='Package']; os.makedirs(os.path.dirname(sys.argv[2]),exist_ok=True); json.dump({'deployment':sys.argv[3],'components':c},open(sys.argv[2],'w'),indent=1)" "$HQ_PRE/r.json" "$HQ_OUT/manifest/haviq-pre-state.json" "$HQ_DEP" "$HQ_OUT" || { echo "[haviq] pre-deploy versions not captured: the retrieve from the target failed"; exit 0; }
            export GIT_INDEX_FILE="$HQ_PRE/idx" GIT_AUTHOR_NAME=HAV-IQ GIT_AUTHOR_EMAIL=noreply@haviq.io GIT_COMMITTER_NAME=HAV-IQ GIT_COMMITTER_EMAIL=noreply@haviq.io
            HQ_GIT=$(git rev-parse --absolute-git-dir)
            HQ_C=$(cd "$HQ_OUT" && git --git-dir="$HQ_GIT" --work-tree=. add -A . && HQ_TREE=$(git --git-dir="$HQ_GIT" write-tree) \
              && git --git-dir="$HQ_GIT" commit-tree "$HQ_TREE" -m "[skip ci] [haviq-pre:$HQ_DEP]")
            if [ -z "$HQ_C" ]; then echo "[haviq] pre-deploy versions not captured: could not build the capture commit"; exit 0; fi
            git push -q origin "$HQ_C:refs/tags/hq-pre-$HQ_DEP" 2>/dev/null \
              && echo "[haviq] pre-deploy versions captured: hq-pre-$HQ_DEP" || echo "[haviq] pre-deploy versions not captured: could not push tag hq-pre-$HQ_DEP"
          ) || true; fi
          sf project deploy $DCMD --manifest manifest/package.xml --target-org target --ignore-conflicts
      - name: Notify HAV-IQ
        if: always()
        continue-on-error: true
        env:
          SF_JOB_STATUS: ${{ job.status }}
          SF_WEBHOOK_SECRET: ${{ secrets.SF_WEBHOOK_SECRET }}
          SF_BRANCH: ${{ github.head_ref || github.ref_name }}
          SF_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
