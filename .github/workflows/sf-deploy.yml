            done < /tmp/haviq_keep.txt
          else
            echo "[haviq] no keep-list in the request — refusing to guess"
            echo "[haviq] which retrieved files are safe to commit."
            exit 1
          fi
          for HQ_TRY in 1 2 3 4 5; do
            rm -rf /tmp/haviq_conv
            sf project convert source -r force-app -d /tmp/haviq_conv --json > /tmp/haviq_conv.json 2>/dev/null && break
            BAD=$(python3 -c "import json,re;raw=open('/tmp/haviq_conv.json').read();raw=raw[raw.find(chr(123)):] if chr(123) in raw else '{}';m=re.search(r'(force-app/\S+-meta\.xml): Expected source files', json.loads(raw).get('message') or '');print(m.group(1) if m else '')" 2>/dev/null)
            [ -z "$BAD" ] && break
            echo "[haviq] not committing $BAD — Salesforce did not export its content (a certificate key is never exported)."
            git rm -q --cached --ignore-unmatch -- "$BAD" >/dev/null 2>&1 || true
            rm -f -- "$BAD"
          done
          if git diff --cached --quiet; then
            echo "[haviq] nothing to commit — the retrieve produced no files."
          else
            git commit -m "chore: HAV-IQ CI retrieve [skip ci]"
            n=0
            until git push origin HEAD:dev1 2>/tmp/haviq_push.err; do
              n=$((n+1))
              sed "s/^/[haviq]   /" /tmp/haviq_push.err || true
              if grep -qiE "restrict|protected|permission|denied|403" /tmp/haviq_push.err; then
                echo "[haviq] GitHub refused the push to dev1. Branch protection on it"
                echo "[haviq] blocks the workflow's GITHUB_TOKEN. Allow GitHub Actions to push to"
                echo "[haviq] dev1 (or exempt it from the rule), then retry the deployment."
                exit 1
              fi
              [ $n -ge 3 ] && echo "[haviq] push failed after $n attempts" && exit 1
              echo "[haviq] push rejected — the branch moved. Rebasing (attempt $n)."
              git pull --rebase origin dev1 || { \
                echo "[haviq] REBASE CONFLICT. Someone edited the same component"; \
                echo "[haviq] while this retrieve was running. Resolve it in HAV-IQ"; \
                echo "[haviq] and retry — this job will not resolve it for you."; \
                exit 1; }
            done
          fi
      - name: Notify HAV-IQ
        if: always()
        continue-on-error: true
        env:
          HQ_STATUS: ${{ job.status == 'success' && 'success' || 'failed' }}
          HQ_BRANCH: ${{ github.ref_name }}
          HQ_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HAVIQ_PRIVATE_KEY: ${{ secrets.HAVIQ_PRIVATE_KEY }}
          HAVIQ_CLIENT_ID: ${{ vars.HAVIQ_CLIENT_ID }}
          HAVIQ_USERNAME: ${{ vars.HAVIQ_USERNAME }}
          HAVIQ_URL: ${{ vars.HAVIQ_URL }}
          SF_WEBHOOK_SECRET: ${{ secrets.SF_WEBHOOK_SECRET }}
        run: |
          grep -q "\[haviq-retrieve\]" /tmp/haviq_msg.txt 2>/dev/null || exit 0
          echo "$HAVIQ_PRIVATE_KEY" > /tmp/haviq.key
          HAVIQ_LOGIN_OUT=$(sf org login jwt --client-id "$HAVIQ_CLIENT_ID" --jwt-key-file /tmp/haviq.key --username "$HAVIQ_USERNAME" --instance-url "$HAVIQ_URL" --alias haviq-hub 2>&1) || true
          SF_TOKEN=$(sf org auth show-access-token --target-org haviq-hub --json 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['result']['accessToken'])" 2>/dev/null || echo "")
          case "$SF_TOKEN" in *[[:space:]]*) SF_TOKEN="" ;; esac
          if [ -z "$SF_TOKEN" ]; then
            echo "[haviq] callback SKIPPED — no access token. HAV-IQ will read this"
            echo "[haviq] run's result itself within a few minutes. The JWT login said:"
            echo "$HAVIQ_LOGIN_OUT" | head -6 | sed "s/^/[haviq]   /"
          fi
          if [ -n "$SF_TOKEN" ]; then
            DEPID=$(sed -n "s/.*for deployment \([a-zA-Z0-9]*\).*/\1/p" /tmp/haviq_msg.txt | head -1)
            MEMBERS=$(cat /tmp/haviq_members.txt 2>/dev/null || echo "")
            BODY="{\"phase\":\"retrieve\",\"deploymentId\":\"$DEPID\",\"branch\":\"$HQ_BRANCH\",\"status\":\"$HQ_STATUS\",\"retrievedMembers\":\"$MEMBERS\",\"ciRunUrl\":\"$HQ_RUN_URL\"}"
            HAVIQ_HTTP=$(curl -s -o /tmp/haviq_cb.out -w "%{http_code}" -X POST "$HAVIQ_URL/services/apexrest/haviq/pipeline/webhook" -H "Authorization: Bearer $SF_TOKEN" -H "Content-Type: application/json" -H "x-sf-devops-secret: $SF_WEBHOOK_SECRET" -d "$BODY" || echo "000")
            echo "[haviq] retrieve callback HTTP $HAVIQ_HTTP"
            [ "$HAVIQ_HTTP" = "200" ] || head -c 500 /tmp/haviq_cb.out 2>/dev/null | sed "s/^/[haviq]   /" || true
            rm -f /tmp/haviq_cb.out
          fi
          rm -f /tmp/haviq.key server.key /tmp/haviq_members.txt

  # ── Feature PR → target stage (RM-Z8)
  deploy_feature:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request'
      && startsWith(github.head_ref, 'feature/')
      && !contains(github.head_ref, '-resolve-')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @salesforce/cli
      - name: Authenticate to the PR target org
        env:
          HAVIQ_SECRETS: ${{ toJSON(secrets) }}
          HAVIQ_VARS: ${{ toJSON(vars) }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          HQ_FIFO=$(mktemp -u); mkfifo "$HQ_FIFO"; tee -a /tmp/haviq-step.log < "$HQ_FIFO" & HQ_TEE=$!; exec > "$HQ_FIFO" 2>&1; rm -f "$HQ_FIFO"; trap 'HQ_RC=$?; exec >&- 2>&-; wait $HQ_TEE; exit $HQ_RC' EXIT
          TGT=$(echo "$BASE_REF" | tr "[:lower:]" "[:upper:]" | sed "s/[^A-Z0-9]/_/g")
          K=$(echo "$HAVIQ_SECRETS" | jq -r --arg k "SF_JWT_KEY_$TGT"   '.[$k] // empty')
          C=$(echo "$HAVIQ_VARS"    | jq -r --arg k "SF_CLIENT_ID_$TGT" '.[$k] // empty')
          U=$(echo "$HAVIQ_VARS"    | jq -r --arg k "SF_USERNAME_$TGT"  '.[$k] // empty')
          O=$(echo "$HAVIQ_VARS"    | jq -r --arg k "SF_ORG_URL_$TGT"   '.[$k] // empty')
          if [ -z "$K" ]; then
            echo "Missing GitHub Actions SECRET SF_JWT_KEY_$TGT (target branch $BASE_REF)."
            echo "HAV-IQ cannot push secrets — add it under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          if [ -z "$C" ] || [ -z "$U" ] || [ -z "$O" ]; then
            echo "No SF_*_$TGT variables for target branch $BASE_REF — is it a configured stage?"; exit 1;
          fi
          echo "$K" > server.key
          sf org login jwt --client-id "$C" --jwt-key-file server.key --username "$U" --instance-url "$O" --alias target
      - name: Resolve HAV-IQ manifest
        env:
          HAVIQ_VARS: ${{ toJSON(vars) }}
        run: |
          HQ_FIFO=$(mktemp -u); mkfifo "$HQ_FIFO"; tee -a /tmp/haviq-step.log < "$HQ_FIFO" & HQ_TEE=$!; exec > "$HQ_FIFO" 2>&1; rm -f "$HQ_FIFO"; trap 'HQ_RC=$?; exec >&- 2>&-; wait $HQ_TEE; exit $HQ_RC' EXIT
          TOK=$(git log -20 --pretty=%B | grep -oE "\[haviq-dep:[A-Za-z0-9]+\]" | head -1 | sed -E "s/.*:([A-Za-z0-9]+)\]/\1/")
          if [ -z "$TOK" ]; then
            if [ -s manifest/package.xml ]; then
              echo "No [haviq-dep:] token; falling back to the manifest on the branch."
              exit 0
            fi
            echo "ERROR: no manifest on the branch and no [haviq-dep:] token in the commit message"; exit 1
          fi
          echo "SF_DEPLOYMENT_ID=$TOK" >> "$GITHUB_ENV"
          # GitHub stores Actions variable names UPPERCASED, and deploy ids are
          # mixed case — look up the uppercased name or the lookup silently misses.
          TOK=$(echo "$TOK" | tr "[:lower:]" "[:upper:]")
          mkdir -p manifest
          echo "$HAVIQ_VARS" | jq -r --arg k "HAVIQ_PKG_$TOK" '.[$k] // empty' > manifest/package.xml
          if [ ! -s manifest/package.xml ]; then echo "ERROR: variable HAVIQ_PKG_$TOK not set"; exit 1; fi
          echo "$HAVIQ_VARS" | jq -r --arg k "HAVIQ_DESTRUCTIVE_$TOK" '.[$k] // empty' > manifest/destructiveChanges.xml
          echo "[OI-292] manifest (dep $TOK):"; cat manifest/package.xml
      - name: Deploy to the PR target org
        run: |
          HQ_FIFO=$(mktemp -u); mkfifo "$HQ_FIFO"; tee -a /tmp/haviq-step.log < "$HQ_FIFO" & HQ_TEE=$!; exec > "$HQ_FIFO" 2>&1; rm -f "$HQ_FIFO"; trap 'HQ_RC=$?; exec >&- 2>&-; wait $HQ_TEE; exit $HQ_RC' EXIT
          MSG=$(git log -20 --pretty=%B)
          LEVEL=$(echo "$MSG" | grep -oE "\[test-level:[A-Za-z]+\]" | head -1 | sed -E "s/\[test-level:([A-Za-z]+)\]/\1/" || true)
          if [ -z "$LEVEL" ]; then echo "$MSG" | grep -q "\[run-tests\]" && LEVEL=RunLocalTests || LEVEL=NoTestRun; fi
          echo "$MSG" | grep -q "\[validate-only\]" && DCMD="start --dry-run" || DCMD=start
          if [ "$LEVEL" = "RunSpecifiedTests" ]; then
            TESTS=$(echo "$MSG" | grep -oE "\[tests:[^]]+\]" | head -1 | sed -E "s/\[tests:(.*)\]/\1/" || true)
            TF=""; for t in $(echo "$TESTS" | tr "," " "); do TF="$TF --tests $t"; done
            # RM-ROLLBACK-BY-TARGET-STATE: save what the target holds before this deploy changes it.
            if [ "${DCMD:-start}" = "start" ]; then (
              set +e
              HQ_DEP="${SF_DEPLOYMENT_ID:-$(git log -20 --pretty=%B | grep -oE "\[haviq-dep:[A-Za-z0-9]+\]" | head -1 | sed -E "s/.*:([A-Za-z0-9]+)\]/\1/")}"
              if [ -z "$HQ_DEP" ]; then echo "[haviq] pre-deploy versions not captured: no deployment id in the commit"; exit 0; fi
              if git ls-remote --tags origin "refs/tags/hq-pre-$HQ_DEP" 2>/dev/null | grep -q .; then echo "[haviq] pre-deploy versions captured: hq-pre-$HQ_DEP (by an earlier run)"; exit 0; fi
              HQ_PRE=$(mktemp -d); HQ_OUT="hq-pre-$HQ_DEP"; trap 'rm -rf "$HQ_OUT"' EXIT
              sf project retrieve start --manifest manifest/package.xml --target-org target --ignore-conflicts --output-dir "$HQ_OUT" --json > "$HQ_PRE/r.json" 2>/dev/null
              python3 -c "import json,sys,os; d=json.load(open(sys.argv[1])); r=d.get('result') or {}; sys.exit(1) if d.get('status',1)!=0 else None; out=os.path.realpath(sys.argv[4]); fs=[f for f in (r.get('files') or []) if f.get('state')!='Failed' and f.get('filePath')]; lm={(p.get('type'),p.get('fullName')):p.get('lastModifiedDate') for p in (r.get('fileProperties') or [])}; ks=list(dict.fromkeys([(f.get('type'),f.get('fullName')) for f in fs]+[k for k in lm if k[0]])); c=[{'type':t,'fullName':n,'lastModifiedDate':lm.get((t,n)),'files':sorted(os.path.relpath(os.path.realpath(f['filePath']),out) for f in fs if f.get('type')==t and f.get('fullName')==n)} for (t,n) in ks if t and t!='Package']; os.makedirs(os.path.dirname(sys.argv[2]),exist_ok=True); json.dump({'deployment':sys.argv[3],'components':c},open(sys.argv[2],'w'),indent=1)" "$HQ_PRE/r.json" "$HQ_OUT/manifest/haviq-pre-state.json" "$HQ_DEP" "$HQ_OUT" || { echo "[haviq] pre-deploy versions not captured: the retrieve from the target failed"; exit 0; }
              export GIT_INDEX_FILE="$HQ_PRE/idx" GIT_AUTHOR_NAME=HAV-IQ GIT_AUTHOR_EMAIL=noreply@haviq.io GIT_COMMITTER_NAME=HAV-IQ GIT_COMMITTER_EMAIL=noreply@haviq.io
              HQ_GIT=$(git rev-parse --absolute-git-dir)
              HQ_C=$(cd "$HQ_OUT" && git --git-dir="$HQ_GIT" --work-tree=. add -A . && HQ_TREE=$(git --git-dir="$HQ_GIT" write-tree) \
                && git --git-dir="$HQ_GIT" commit-tree "$HQ_TREE" -m "[skip ci] [haviq-pre:$HQ_DEP]")
              if [ -z "$HQ_C" ]; then echo "[haviq] pre-deploy versions not captured: could not build the capture commit"; exit 0; fi
              git push -q origin "$HQ_C:refs/tags/hq-pre-$HQ_DEP" 2>/dev/null \
                && echo "[haviq] pre-deploy versions captured: hq-pre-$HQ_DEP" || echo "[haviq] pre-deploy versions not captured: could not push tag hq-pre-$HQ_DEP"
            ) || true; fi
            sf project deploy $DCMD --manifest manifest/package.xml --target-org target --ignore-conflicts --test-level RunSpecifiedTests $TF --wait 30
          else
            # RM-ROLLBACK-BY-TARGET-STATE: save what the target holds before this deploy changes it.
            if [ "${DCMD:-start}" = "start" ]; then (
              set +e
              HQ_DEP="${SF_DEPLOYMENT_ID:-$(git log -20 --pretty=%B | grep -oE "\[haviq-dep:[A-Za-z0-9]+\]" | head -1 | sed -E "s/.*:([A-Za-z0-9]+)\]/\1/")}"
              if [ -z "$HQ_DEP" ]; then echo "[haviq] pre-deploy versions not captured: no deployment id in the commit"; exit 0; fi
              if git ls-remote --tags origin "refs/tags/hq-pre-$HQ_DEP" 2>/dev/null | grep -q .; then echo "[haviq] pre-deploy versions captured: hq-pre-$HQ_DEP (by an earlier run)"; exit 0; fi
              HQ_PRE=$(mktemp -d); HQ_OUT="hq-pre-$HQ_DEP"; trap 'rm -rf "$HQ_OUT"' EXIT
              sf project retrieve start --manifest manifest/package.xml --target-org target --ignore-conflicts --output-dir "$HQ_OUT" --json > "$HQ_PRE/r.json" 2>/dev/null
              python3 -c "import json,sys,os; d=json.load(open(sys.argv[1])); r=d.get('result') or {}; sys.exit(1) if d.get('status',1)!=0 else None; out=os.path.realpath(sys.argv[4]); fs=[f for f in (r.get('files') or []) if f.get('state')!='Failed' and f.get('filePath')]; lm={(p.get('type'),p.get('fullName')):p.get('lastModifiedDate') for p in (r.get('fileProperties') or [])}; ks=list(dict.fromkeys([(f.get('type'),f.get('fullName')) for f in fs]+[k for k in lm if k[0]])); c=[{'type':t,'fullName':n,'lastModifiedDate':lm.get((t,n)),'files':sorted(os.path.relpath(os.path.realpath(f['filePath']),out) for f in fs if f.get('type')==t and f.get('fullName')==n)} for (t,n) in ks if t and t!='Package']; os.makedirs(os.path.dirname(sys.argv[2]),exist_ok=True); json.dump({'deployment':sys.argv[3],'components':c},open(sys.argv[2],'w'),indent=1)" "$HQ_PRE/r.json" "$HQ_OUT/manifest/haviq-pre-state.json" "$HQ_DEP" "$HQ_OUT" || { echo "[haviq] pre-deploy versions not captured: the retrieve from the target failed"; exit 0; }
              export GIT_INDEX_FILE="$HQ_PRE/idx" GIT_AUTHOR_NAME=HAV-IQ GIT_AUTHOR_EMAIL=noreply@haviq.io GIT_COMMITTER_NAME=HAV-IQ GIT_COMMITTER_EMAIL=noreply@haviq.io
              HQ_GIT=$(git rev-parse --absolute-git-dir)
              HQ_C=$(cd "$HQ_OUT" && git --git-dir="$HQ_GIT" --work-tree=. add -A . && HQ_TREE=$(git --git-dir="$HQ_GIT" write-tree) \
                && git --git-dir="$HQ_GIT" commit-tree "$HQ_TREE" -m "[skip ci] [haviq-pre:$HQ_DEP]")
              if [ -z "$HQ_C" ]; then echo "[haviq] pre-deploy versions not captured: could not build the capture commit"; exit 0; fi
              git push -q origin "$HQ_C:refs/tags/hq-pre-$HQ_DEP" 2>/dev/null \
                && echo "[haviq] pre-deploy versions captured: hq-pre-$HQ_DEP" || echo "[haviq] pre-deploy versions not captured: could not push tag hq-pre-$HQ_DEP"
            ) || true; fi
            sf project deploy $DCMD --manifest manifest/package.xml --target-org target --ignore-conflicts --test-level "$LEVEL" --wait 30
          fi
      - name: Apply destructive changes
        run: |
          HQ_FIFO=$(mktemp -u); mkfifo "$HQ_FIFO"; tee -a /tmp/haviq-step.log < "$HQ_FIFO" & HQ_TEE=$!; exec > "$HQ_FIFO" 2>&1; rm -f "$HQ_FIFO"; trap 'HQ_RC=$?; exec >&- 2>&-; wait $HQ_TEE; exit $HQ_RC' EXIT
          if [ -s manifest/destructiveChanges.xml ] && grep -q "<members>" manifest/destructiveChanges.xml; then
            echo "Applying destructive changes..."
            set +e
            DOUT=$(sf project deploy start --manifest manifest/package.xml --post-destructive-changes manifest/destructiveChanges.xml --target-org target --ignore-conflicts --test-level NoTestRun --wait 30 2>&1)
            DRC=$?
            set -e
            echo "$DOUT"
            if [ $DRC -ne 0 ]; then
              ABSENT=$(echo "$DOUT" | grep -oE "No [A-Za-z]+ named:? [^ ]+ found" | sort -u)
              OTHER=$(echo "$DOUT" | grep -iE "error|Problem" | grep -vcE "No [A-Za-z]+ named:? [^ ]+ found")
              if [ -n "$ABSENT" ] && [ "$OTHER" -eq 0 ]; then
                echo "[OI-317] Deletions skipped - already absent from the target org:"
                echo "$ABSENT"
                echo "[OI-317] The intended end state is already true. Continuing."
                echo "$ABSENT" > /tmp/haviq-already-absent.txt
              else
                echo "[OI-317] Destructive deploy failed beyond already-absent components."
                exit $DRC
              fi
            fi
          else
            echo "No destructive changes."
          fi
      - name: Notify HAV-IQ
        if: always()
        continue-on-error: true
        env:
          SF_JOB_STATUS: ${{ job.status }}
          SF_WEBHOOK_SECRET: ${{ secrets.SF_WEBHOOK_SECRET }}
          SF_BRANCH: ${{ github.head_ref || github.ref_name }}
          SF_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          STATUS=$([ "$SF_JOB_STATUS" = "success" ] && echo "passed" || echo "failed")
          ABSENT_JSON=""
          if [ -f /tmp/haviq-already-absent.txt ]; then
            ABSENT_JSON=$(python3 -c "import json;t=open('/tmp/haviq-already-absent.txt').read().strip();print(',\"alreadyAbsent\":'+json.dumps(t) if t else '')" 2>/dev/null || echo "")
          fi
          # OI-209: capture deploy failure reason from job log
          FAILURE_REASON_JSON=""
          if [ "$STATUS" = "failed" ]; then
            TRACE=$(cat /tmp/haviq-step.log 2>/dev/null || echo "")
            if [ -z "$TRACE" ]; then echo "[haviq] captured step log is empty; the failure reason will be blank."; fi
            MATCHED=$(echo "$TRACE" | grep -E "Problem|No such column|Variable does not exist|Component Failures|FAILED|✘" | head -40)
            # Fallback: a fixed keyword list always misses the next novel error — keep the trace tail so the reason is never blank.
            if [ -z "$MATCHED" ]; then MATCHED=$(echo "$TRACE" | grep -v "^[[:space:]]*$" | tail -40); fi
            FAILURE_REASON_JSON=$(echo "$MATCHED" | sed "s/\x1b\[[0-9;]*m//g" | head -c 30000 | python3 -c "import sys,json;t=sys.stdin.read().strip();print(json.dumps(t) if t else \"\")" 2>/dev/null || echo "")
          fi
          echo "${{ secrets.HAVIQ_PRIVATE_KEY }}" > /tmp/haviq.key
          if ! sf org login jwt --client-id "${{ vars.HAVIQ_CLIENT_ID }}" --jwt-key-file /tmp/haviq.key --username "${{ vars.HAVIQ_USERNAME }}" --instance-url "${{ vars.HAVIQ_URL }}" --alias haviq-hub > /tmp/haviq_login.out 2>&1; then
            echo "[haviq] Could not log in to HAV-IQ to report this result. The deploy result above is unaffected:"
            echo "[haviq] HAV-IQ reads it by polling instead, a few minutes later. To fix reporting, set the"
            echo "[haviq] pipeline's Self-Auth tab, click Regenerate CI YAML, and check the HAVIQ_PRIVATE_KEY secret."
            sed "s/^/[haviq]   /" /tmp/haviq_login.out | head -5
            rm -f /tmp/haviq.key
            exit 0
          fi
          SF_TOKEN=$(sf org auth show-access-token --target-org haviq-hub --json | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['result']['accessToken'])" 2>/dev/null || echo "")
          if [ -n "$SF_TOKEN" ]; then
            if [ -n "$FAILURE_REASON_JSON" ]; then
              BODY="{\"branch\":\"$SF_BRANCH\",\"commitSha\":\"$SF_COMMIT_SHA\",\"deploymentId\":\"$SF_DEPLOYMENT_ID\",\"status\":\"$STATUS\",\"failureReason\":$FAILURE_REASON_JSON,\"ciRunUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"$ABSENT_JSON}"
            else
              BODY="{\"branch\":\"$SF_BRANCH\",\"commitSha\":\"$SF_COMMIT_SHA\",\"deploymentId\":\"$SF_DEPLOYMENT_ID\",\"status\":\"$STATUS\",\"ciRunUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"$ABSENT_JSON}"
            fi
            HAVIQ_HTTP=$(curl -s -o /tmp/haviq_cb.out -w "%{http_code}" -X POST "${{ vars.HAVIQ_URL }}/services/apexrest/haviq/pipeline/webhook" -H "Authorization: Bearer $SF_TOKEN" -H "Content-Type: application/json" -H "x-sf-devops-secret: $SF_WEBHOOK_SECRET" -d "$BODY" || echo "000")
            echo "HAV-IQ callback HTTP $HAVIQ_HTTP"; cat /tmp/haviq_cb.out 2>/dev/null || true
            if [ "$HAVIQ_HTTP" = "401" ]; then echo "Callback rejected: check the SF_WEBHOOK_SECRET repository secret matches the pipeline webhook secret."; fi
          fi
          rm -f /tmp/haviq.key

  # ── Record a resolved conflict as a real merge (OI-605)
  haviq_resolve:
    name: haviq:resolve-merge
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push'
      && contains(github.ref_name, '-merge-')
      && contains(github.event.head_commit.message, '[haviq-resolve]')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge the Work Item branch with the HAV-IQ resolution
        env:
          HQ_BRANCH: ${{ github.ref_name }}
        run: |
          HQ_FIFO=$(mktemp -u); mkfifo "$HQ_FIFO"; tee -a /tmp/haviq-step.log < "$HQ_FIFO" & HQ_TEE=$!; exec > "$HQ_FIFO" 2>&1; rm -f "$HQ_FIFO"; trap 'HQ_RC=$?; exec >&- 2>&-; wait $HQ_TEE; exit $HQ_RC' EXIT
          git log -1 --pretty=%B > /tmp/haviq_msg.txt
          if ! grep -q "\[haviq-resolve\]" /tmp/haviq_msg.txt; then
            echo "[haviq] Not a HAV-IQ resolve request; nothing to do."
            exit 0
          fi
          set -e
          git config user.email "ci@haviq.local"
          git config user.name "HAV-IQ CI"
          git fetch --unshallow origin >/dev/null 2>&1 || true
          WI=$(python3 -c "import json;print(json.load(open('manifest/haviq-resolve.json'))['workItemBranch'])")
          case "$WI" in ""|*..*|*[!A-Za-z0-9._/-]*) echo "[haviq] The request names an unsafe branch; stopping."; exit 1 ;; esac
          python3 -c "import json;[print(p) for p in json.load(open('manifest/haviq-resolve.json'))['conflictPaths']]" > /tmp/haviq_conflicts.txt
          git fetch origin "+refs/heads/$WI:refs/remotes/origin/$WI"
          git merge --no-ff --no-commit "origin/$WI" > /tmp/haviq_merge.out 2>&1 || true
          while IFS= read -r P; do
            [ -z "$P" ] && continue
            git checkout --ours -- "$P" 2>/dev/null && git add -- "$P" || git rm -q --cached --ignore-unmatch -- "$P"
          done < /tmp/haviq_conflicts.txt
          for P in $(git diff --name-only --diff-filter=U); do
            case "$P" in .gitlab-ci.yml|bitbucket-pipelines.yml|.github/workflows/*) git checkout --ours -- "$P"; git add -- "$P" ;; esac
          done
          LEFT=$(git diff --name-only --diff-filter=U)
          if [ -n "$LEFT" ]; then
            echo "[haviq] These files also conflict, and were not resolved in HAV-IQ:"
            echo "$LEFT" | sed "s/^/[haviq]   /"
            echo "[haviq] Nothing was pushed. Resolve them in HAV-IQ (Tracker → Resolve Conflicts) and resume."
            printf "%s" "$LEFT" | tr "\n" "," > /tmp/haviq_unresolved.txt
            git merge --abort || true
            exit 1
          fi
          git rm -q --ignore-unmatch manifest/haviq-resolve.json
          sed "s/ \[haviq-resolve\]//" /tmp/haviq_msg.txt > /tmp/haviq_merge_msg.txt
          git commit -q -F /tmp/haviq_merge_msg.txt
          if ! git push origin "HEAD:$HQ_BRANCH" 2>/tmp/haviq_push.err; then
            sed "s/^/[haviq]   /" /tmp/haviq_push.err || true
            echo "[haviq] The push to $HQ_BRANCH was refused. Nothing was deployed; retry the deployment."
            exit 1
          fi
          git rev-parse HEAD > /tmp/haviq_head.txt
          echo "[haviq] Merged $WI into $HQ_BRANCH with the resolution from HAV-IQ."
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '22'
      - run: npm install -g @salesforce/cli
        if: always()
      - name: Notify HAV-IQ
        if: always()
        continue-on-error: true
        env:
          HQ_STATUS: ${{ job.status == 'success' && 'success' || 'failed' }}
          HQ_BRANCH: ${{ github.ref_name }}
          HQ_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HAVIQ_PRIVATE_KEY: ${{ secrets.HAVIQ_PRIVATE_KEY }}
          HAVIQ_CLIENT_ID: ${{ vars.HAVIQ_CLIENT_ID }}
          HAVIQ_USERNAME: ${{ vars.HAVIQ_USERNAME }}
          HAVIQ_URL: ${{ vars.HAVIQ_URL }}
          SF_WEBHOOK_SECRET: ${{ secrets.SF_WEBHOOK_SECRET }}
        run: |
          grep -q "\[haviq-resolve\]" /tmp/haviq_msg.txt 2>/dev/null || exit 0
          echo "$HAVIQ_PRIVATE_KEY" > /tmp/haviq.key
          HAVIQ_LOGIN_OUT=$(sf org login jwt --client-id "$HAVIQ_CLIENT_ID" --jwt-key-file /tmp/haviq.key --username "$HAVIQ_USERNAME" --instance-url "$HAVIQ_URL" --alias haviq-hub 2>&1) || true
          SF_TOKEN=$(sf org auth show-access-token --target-org haviq-hub --json 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['result']['accessToken'])" 2>/dev/null || echo "")
          case "$SF_TOKEN" in *[[:space:]]*) SF_TOKEN="" ;; esac
          if [ -z "$SF_TOKEN" ]; then
            echo "[haviq] callback SKIPPED — no access token. HAV-IQ will read this"
            echo "[haviq] run's result itself within a few minutes. The JWT login said:"
            echo "$HAVIQ_LOGIN_OUT" | head -6 | sed "s/^/[haviq]   /"
          fi
          if [ -n "$SF_TOKEN" ]; then
            DEPID=$(sed -n "s/.*\[haviq-dep:\([a-zA-Z0-9]*\)\].*/\1/p" /tmp/haviq_msg.txt | head -1)
            HEADSHA=$(cat /tmp/haviq_head.txt 2>/dev/null || echo "")
            UNRESOLVED=$(cat /tmp/haviq_unresolved.txt 2>/dev/null || echo "")
            BODY="{\"phase\":\"resolve\",\"deploymentId\":\"$DEPID\",\"branch\":\"$HQ_BRANCH\",\"status\":\"$HQ_STATUS\",\"commitSha\":\"$HEADSHA\",\"unresolvedFiles\":\"$UNRESOLVED\",\"ciRunUrl\":\"$HQ_RUN_URL\"}"
            HAVIQ_HTTP=$(curl -s -o /tmp/haviq_cb.out -w "%{http_code}" -X POST "$HAVIQ_URL/services/apexrest/haviq/pipeline/webhook" -H "Authorization: Bearer $SF_TOKEN" -H "Content-Type: application/json" -H "x-sf-devops-secret: $SF_WEBHOOK_SECRET" -d "$BODY" || echo "000")
            echo "[haviq] resolve callback HTTP $HAVIQ_HTTP"
            [ "$HAVIQ_HTTP" = "200" ] || head -c 500 /tmp/haviq_cb.out 2>/dev/null | sed "s/^/[haviq]   /" || true
            rm -f /tmp/haviq_cb.out
          fi
          rm -f /tmp/haviq.key /tmp/haviq_head.txt /tmp/haviq_unresolved.txt

  # ── Git-native first deploy: copy the Work Item from the source branch
  haviq_assemble:
    name: haviq:assemble-copy
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'repository_dispatch'
      && github.event.action == 'haviq-assemble'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch }}
          fetch-depth: 0
      - name: Copy the Work Item from the source branch with git
        env:
          HQ_BRANCH: ${{ github.event.client_payload.branch }}
        run: |
          HQ_FIFO=$(mktemp -u); mkfifo "$HQ_FIFO"; tee -a /tmp/haviq-step.log < "$HQ_FIFO" & HQ_TEE=$!; exec > "$HQ_FIFO" 2>&1; rm -f "$HQ_FIFO"; trap 'HQ_RC=$?; exec >&- 2>&-; wait $HQ_TEE; exit $HQ_RC' EXIT
          git log -1 --pretty=%B > /tmp/haviq_msg.txt
          if ! grep -q "\[haviq-assemble\]" /tmp/haviq_msg.txt; then
            echo "[haviq] Not a HAV-IQ assemble request; nothing to do."
            exit 0
          fi
          set -e
          case "$HQ_BRANCH" in feature/*) ;; *) echo "[haviq] Not a Work Item branch: refusing."; exit 1 ;; esac
          case "$HQ_BRANCH" in *..*|*[!A-Za-z0-9._/-]*) echo "[haviq] The branch name is unsafe; stopping."; exit 1 ;; esac
          git config user.email "ci@haviq.local"
          git config user.name "HAV-IQ CI"
          SRC=$(python3 -c "import json;print(json.load(open('manifest/haviq-assemble.json'))['sourceBranch'])")
          case "$SRC" in ""|*..*|*[!A-Za-z0-9._/-]*) echo "[haviq] The request names an unsafe branch; stopping."; exit 1 ;; esac
          git fetch origin "+refs/heads/$SRC:refs/remotes/origin/$SRC"
          python3 - <<'PY'
          import json, subprocess, sys
          req = json.load(open("manifest/haviq-assemble.json"))
          src = "origin/" + req["sourceBranch"]
          out = subprocess.run(["git", "ls-tree", "-r", "--name-only", src], capture_output=True, text=True, check=True)
          tree = set(out.stdout.splitlines())
          take = set()
          missing = []
          inline = []
          for c in req["components"]:
              if c.get("inline"):
                  inline.append(c)
                  continue
              need = [c["primary"]] + c.get("required", [])
              gone = [p for p in need if p not in tree]
              if gone:
                  missing.append(c["label"] + " (expected " + ", ".join(gone) + ")")
                  continue
              take.update(need)
              for pre in c.get("prefixes", []):
                  take.update(f for f in tree if f.startswith(pre))
          if missing:
              open("/tmp/haviq_missing.txt", "w").write("; ".join(missing))
              print("[haviq] These components are not on " + req["sourceBranch"] + ", so nothing was pushed:")
              for m in missing:
                  print("[haviq]   " + m)
              sys.exit(1)
          if "sfdx-project.json" in tree:
              take.add("sfdx-project.json")
          files = sorted(take)
          for i in range(0, len(files), 200):
              subprocess.run(["git", "checkout", src, "--"] + files[i:i + 200], check=True)
          import os, re
          def find(xml, el, member):
              for m in re.finditer(r"<" + el + r">(.*?)</" + el + r">", xml, re.S):
                  f = re.search(r"<fullName>(.*?)</fullName>", m.group(1), re.S)
                  if f and f.group(1).strip() == member:
                      return m
              return None
          for c in inline:
              i = c["inline"]; path = c["primary"]
              if path in take:
                  continue
              srcxml = subprocess.run(["git", "show", src + ":" + path], capture_output=True, text=True).stdout
              got = find(srcxml, i["element"], i["member"]) if srcxml else None
              if not got:
                  missing.append(c["label"] + " (expected in " + path + ")")
                  continue
              dst = open(path).read() if os.path.exists(path) else ('<?xml version="1.0" encoding="UTF-8"?>\n<' + i["root"] + ' xmlns="http://soap.sforce.com/2006/04/metadata">\n</' + i["root"] + '>\n')
              old = find(dst, i["element"], i["member"])
              if old:
                  dst = dst[:old.start()] + got.group(0) + dst[old.end():]
              else:
                  same = list(re.finditer(r"</" + i["element"] + r">", dst))
                  at = same[-1].end() if same else dst.rindex("</" + i["root"] + ">")
                  lead = "\n    " if same else "    "
                  tail = "" if same else "\n"
                  dst = dst[:at] + lead + got.group(0) + tail + dst[at:]
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              open(path, "w").write(dst)
              subprocess.run(["git", "add", "--", path], check=True)
              files.append(path)
          if missing:
              open("/tmp/haviq_missing.txt", "w").write("; ".join(missing))
              print("[haviq] These entries are not on " + req["sourceBranch"] + ", so nothing was pushed:")
              for m in missing:
                  print("[haviq]   " + m)
              sys.exit(1)
          print("[haviq] Copied " + str(len(files)) + " file(s) for " + str(len(req["components"])) + " component(s) from " + req["sourceBranch"] + " with git.")
          PY
          git rm -q --ignore-unmatch manifest/haviq-assemble.json
          sed "s/ \[haviq-assemble\]//" /tmp/haviq_msg.txt > /tmp/haviq_commit_msg.txt
          git commit -q -F /tmp/haviq_commit_msg.txt
          if ! git push origin "HEAD:$HQ_BRANCH" 2>/tmp/haviq_push.err; then
            sed "s/^/[haviq]   /" /tmp/haviq_push.err || true
            echo "[haviq] The push to $HQ_BRANCH was refused. Nothing was deployed; retry the deployment."
            exit 1
          fi
          git rev-parse HEAD > /tmp/haviq_head.txt
          echo "[haviq] Assembled $HQ_BRANCH from $SRC; the merge request deploys it."
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '22'
      - run: npm install -g @salesforce/cli
        if: always()
      - name: Notify HAV-IQ
        if: always()
        continue-on-error: true
        env:
          HQ_STATUS: ${{ job.status == 'success' && 'success' || 'failed' }}
          HQ_BRANCH: ${{ github.event.client_payload.branch }}
          HQ_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HAVIQ_PRIVATE_KEY: ${{ secrets.HAVIQ_PRIVATE_KEY }}
          HAVIQ_CLIENT_ID: ${{ vars.HAVIQ_CLIENT_ID }}
          HAVIQ_USERNAME: ${{ vars.HAVIQ_USERNAME }}
          HAVIQ_URL: ${{ vars.HAVIQ_URL }}
          SF_WEBHOOK_SECRET: ${{ secrets.SF_WEBHOOK_SECRET }}
        run: |
          grep -q "\[haviq-assemble\]" /tmp/haviq_msg.txt 2>/dev/null || exit 0
          echo "$HAVIQ_PRIVATE_KEY" > /tmp/haviq.key
          HAVIQ_LOGIN_OUT=$(sf org login jwt --client-id "$HAVIQ_CLIENT_ID" --jwt-key-file /tmp/haviq.key --username "$HAVIQ_USERNAME" --instance-url "$HAVIQ_URL" --alias haviq-hub 2>&1) || true
          SF_TOKEN=$(sf org auth show-access-token --target-org haviq-hub --json 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['result']['accessToken'])" 2>/dev/null || echo "")
          case "$SF_TOKEN" in *[[:space:]]*) SF_TOKEN="" ;; esac
          if [ -z "$SF_TOKEN" ]; then
            echo "[haviq] callback SKIPPED — no access token. HAV-IQ will read this"
            echo "[haviq] run's result itself within a few minutes. The JWT login said:"
            echo "$HAVIQ_LOGIN_OUT" | head -6 | sed "s/^/[haviq]   /"
          fi
          if [ -n "$SF_TOKEN" ]; then
            DEPID=$(sed -n "s/.*\[haviq-dep:\([a-zA-Z0-9]*\)\].*/\1/p" /tmp/haviq_msg.txt | head -1)
            HEADSHA=$(cat /tmp/haviq_head.txt 2>/dev/null || echo "")
            MISSING=$(cat /tmp/haviq_missing.txt 2>/dev/null | tr -d '"\\' || echo "")
            BODY="{\"phase\":\"assemble\",\"deploymentId\":\"$DEPID\",\"branch\":\"$HQ_BRANCH\",\"status\":\"$HQ_STATUS\",\"commitSha\":\"$HEADSHA\",\"missingComponents\":\"$MISSING\",\"ciRunUrl\":\"$HQ_RUN_URL\"}"
            HAVIQ_HTTP=$(curl -s -o /tmp/haviq_cb.out -w "%{http_code}" -X POST "$HAVIQ_URL/services/apexrest/haviq/pipeline/webhook" -H "Authorization: Bearer $SF_TOKEN" -H "Content-Type: application/json" -H "x-sf-devops-secret: $SF_WEBHOOK_SECRET" -d "$BODY" || echo "000")
            echo "[haviq] assemble callback HTTP $HAVIQ_HTTP"
            [ "$HAVIQ_HTTP" = "200" ] || head -c 500 /tmp/haviq_cb.out 2>/dev/null | sed "s/^/[haviq]   /" || true
            rm -f /tmp/haviq_cb.out
          fi
          rm -f /tmp/haviq.key /tmp/haviq_head.txt /tmp/haviq_missing.txt

  # ── Git merges the Work Item into its target (conflicts resolved by git)
  haviq_merge:
    name: haviq:merge-run
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'repository_dispatch'
      && github.event.action == 'haviq-merge'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch }}
          fetch-depth: 0
      - name: Merge with git
        env:
          HQ_BRANCH: ${{ github.event.client_payload.branch }}
        run: |
          HQ_FIFO=$(mktemp -u); mkfifo "$HQ_FIFO"; tee -a /tmp/haviq-step.log < "$HQ_FIFO" & HQ_TEE=$!; exec > "$HQ_FIFO" 2>&1; rm -f "$HQ_FIFO"; trap 'HQ_RC=$?; exec >&- 2>&-; wait $HQ_TEE; exit $HQ_RC' EXIT
          git config user.email "ci@haviq.local"; git config user.name "HAV-IQ CI"
          git log -1 --pretty=%B > /tmp/haviq_msg.txt
          if ! grep -q "\[haviq-merge\]" /tmp/haviq_msg.txt; then
            echo "[haviq] Not a HAV-IQ merge request; nothing to do."
            exit 0
          fi
          git fetch --unshallow origin >/dev/null 2>&1 || true
          set +e
          python3 manifest/haviq-merge.py run manifest/haviq-merge.json
          RC=$?
          set -e
          if [ "$RC" != "0" ] && [ "$RC" != "3" ]; then
            echo "[haviq] The merge job could not run. Nothing was pushed; retry the deployment."
            exit 1
          fi
          if ! git push origin "HEAD:$HQ_BRANCH" 2>/tmp/haviq_push.err; then
            sed "s/^/[haviq]   /" /tmp/haviq_push.err || true
            echo "[haviq] The push to $HQ_BRANCH was refused. Nothing was deployed; retry the deployment."
            exit 1
          fi
          echo "[haviq] Merge job finished; HAV-IQ reads the outcome from $HQ_BRANCH."
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '22'
      - run: npm install -g @salesforce/cli
        if: always()
      - name: Notify HAV-IQ
        if: always()
        continue-on-error: true
        env:
          HQ_STATUS: ${{ job.status == 'success' && 'success' || 'failed' }}
          HQ_BRANCH: ${{ github.event.client_payload.branch }}
          HQ_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HAVIQ_PRIVATE_KEY: ${{ secrets.HAVIQ_PRIVATE_KEY }}
          HAVIQ_CLIENT_ID: ${{ vars.HAVIQ_CLIENT_ID }}
          HAVIQ_USERNAME: ${{ vars.HAVIQ_USERNAME }}
          HAVIQ_URL: ${{ vars.HAVIQ_URL }}
          SF_WEBHOOK_SECRET: ${{ secrets.SF_WEBHOOK_SECRET }}
        run: |
          grep -q "\[haviq-merge\]" /tmp/haviq_msg.txt 2>/dev/null || exit 0
          echo "$HAVIQ_PRIVATE_KEY" > /tmp/haviq.key
          HAVIQ_LOGIN_OUT=$(sf org login jwt --client-id "$HAVIQ_CLIENT_ID" --jwt-key-file /tmp/haviq.key --username "$HAVIQ_USERNAME" --instance-url "$HAVIQ_URL" --alias haviq-hub 2>&1) || true
          SF_TOKEN=$(sf org auth show-access-token --target-org haviq-hub --json 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['result']['accessToken'])" 2>/dev/null || echo "")
          case "$SF_TOKEN" in *[[:space:]]*) SF_TOKEN="" ;; esac
          if [ -z "$SF_TOKEN" ]; then
            echo "[haviq] callback SKIPPED — no access token. HAV-IQ will read this"
            echo "[haviq] run's result itself within a few minutes. The JWT login said:"
            echo "$HAVIQ_LOGIN_OUT" | head -6 | sed "s/^/[haviq]   /"
          fi
          if [ -n "$SF_TOKEN" ]; then
            DEPID=$(sed -n "s/.*\[haviq-dep:\([a-zA-Z0-9]*\)\].*/\1/p" /tmp/haviq_msg.txt | head -1)
            BODY="{\"phase\":\"merge\",\"deploymentId\":\"$DEPID\",\"branch\":\"$HQ_BRANCH\",\"status\":\"$HQ_STATUS\",\"ciRunUrl\":\"$HQ_RUN_URL\"}"
            HAVIQ_HTTP=$(curl -s -o /tmp/haviq_cb.out -w "%{http_code}" -X POST "$HAVIQ_URL/services/apexrest/haviq/pipeline/webhook" -H "Authorization: Bearer $SF_TOKEN" -H "Content-Type: application/json" -H "x-sf-devops-secret: $SF_WEBHOOK_SECRET" -d "$BODY" || echo "000")
            echo "[haviq] merge callback HTTP $HAVIQ_HTTP"
            rm -f /tmp/haviq_cb.out
          fi
          rm -f /tmp/haviq.key
